<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Let's Go Holidays Pvt Ltd - Flights, visas, hotels and holiday packages from Sri Lanka.">
  <title>Let's Go Holidays | Travel Beyond</title>

  <style>
    :root{
      --primary:#0b4f8a;
      --primary-dark:#07365f;
      --accent:#f5a623;
      --light:#f5f8fc;
      --dark:#102235;
      --muted:#64748b;
      --white:#fff;
      --shadow:0 15px 45px rgba(16,34,53,.12);
      --radius:20px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}

    body{
      font-family:Arial,Helvetica,sans-serif;
      color:var(--dark);
      line-height:1.6;
      background:#fff;
    }

    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}

    .container{
      width:min(1160px,92%);
      margin:auto;
    }

    /* HEADER */
    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:1000;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);
      box-shadow:0 2px 20px rgba(0,0,0,.06);
    }

    .nav{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      font-size:20px;
      color:var(--primary);
      white-space:nowrap;
    }

    .logo-mark{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      color:#fff;
      background:linear-gradient(135deg,var(--primary),#1c8ed1);
      font-size:21px;
      box-shadow:0 8px 18px rgba(11,79,138,.25);
    }

    nav ul{
      display:flex;
      gap:26px;
      list-style:none;
    }

    nav a{
      font-weight:600;
      font-size:14px;
      color:#334155;
      transition:.25s;
    }

    nav a:hover{color:var(--primary)}

    .nav-btn{
      padding:11px 18px;
      border-radius:999px;
      background:var(--primary);
      color:#fff!important;
    }

    .menu{
      display:none;
      border:0;
      background:none;
      font-size:27px;
      cursor:pointer;
    }

    /* HERO */
    .hero{
      min-height:720px;
      padding-top:76px;
      display:flex;
      align-items:center;
      background:
        linear-gradient(
          90deg,
          rgba(5,28,49,.88),
          rgba(5,28,49,.45),
          rgba(5,28,49,.12)
        ),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=85")
        center/cover;
      color:#fff;
    }

    .hero-content{
      max-width:720px;
      padding:80px 0;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.25);
      font-size:13px;
      font-weight:700;
      margin-bottom:22px;
    }

    h1{
      font-size:clamp(42px,6vw,72px);
      line-height:1.04;
      letter-spacing:-2px;
      margin-bottom:22px;
    }

    .hero p{
      font-size:19px;
      max-width:640px;
      color:#edf5fb;
      margin-bottom:32px;
    }

    .hero-actions{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 22px;
      border-radius:12px;
      font-weight:800;
      border:2px solid transparent;
      transition:.25s;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--accent);
      color:#17212b;
    }

    .btn-primary:hover{
      transform:translateY(-2px);
      filter:brightness(1.05);
    }

    .btn-light{
      border-color:#fff;
      color:#fff;
      background:rgba(255,255,255,.08);
    }

    .btn-light:hover{
      background:#fff;
      color:var(--primary);
    }

    /* GENERAL */
    section{padding:90px 0}

    .section-head{
      text-align:center;
      max-width:700px;
      margin:0 auto 48px;
    }

    .section-head span{
      color:var(--primary);
      font-weight:800;
      text-transform:uppercase;
      font-size:12px;
      letter-spacing:1.5px;
    }

    .section-head h2{
      font-size:38px;
      line-height:1.15;
      margin:10px 0 14px;
    }

    .section-head p{color:var(--muted)}

    /* SERVICES */
    .services{background:var(--light)}

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .card{
      background:#fff;
      border-radius:var(--radius);
      padding:28px;
      box-shadow:var(--shadow);
      transition:.3s;
      border:1px solid #edf2f7;
    }

    .card:hover{transform:translateY(-7px)}

    .icon{
      width:54px;
      height:54px;
      border-radius:15px;
      display:grid;
      place-items:center;
      background:#eaf4fd;
      color:var(--primary);
      font-size:25px;
      margin-bottom:20px;
    }

    .card h3{
      margin-bottom:8px;
      font-size:19px;
    }

    .card p{
      color:var(--muted);
      font-size:14px;
    }

    /* ABOUT */
    .about-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:60px;
      align-items:center;
    }

    .about-image{position:relative}

    .about-image img{
      width:100%;
      height:480px;
      object-fit:cover;
      border-radius:28px;
      box-shadow:var(--shadow);
    }

    .badge{
      position:absolute;
      right:-20px;
      bottom:28px;
      background:#fff;
      padding:18px 20px;
      border-radius:16px;
      box-shadow:var(--shadow);
      font-weight:800;
      color:var(--primary);
    }

    .about-copy h2{
      font-size:40px;
      line-height:1.15;
      margin:10px 0 18px;
    }

    .about-copy p{
      color:var(--muted);
      margin-bottom:18px;
    }

    .ticks{
      list-style:none;
      display:grid;
      gap:11px;
      margin:25px 0;
    }

    .ticks li:before{
      content:"✓";
      color:var(--primary);
      font-weight:900;
      margin-right:10px;
    }

    .stats{
      display:flex;
      gap:30px;
      flex-wrap:wrap;
      margin-top:28px;
    }

      display:block;
      font-size:27px;
      color:var(--
